[project]
name = "mining-rights-daily-agent"
version = "0.1.0"
description = "MCP-based mining rights daily brief agent with news, PDF resource extraction, and commodity price tools."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

