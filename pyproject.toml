[project]
name = "mining-rights-daily-agent"
version = "0.1.0"
description = "MCP-based mining rights daily brief agent with live crawlers, PDF extraction, price tools, risk scoring, and optional LLM composition."
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11.0", "pypdf>=4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
